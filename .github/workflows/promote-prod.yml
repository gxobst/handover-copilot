name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      override_image_tag:
        description: "Optional: override specific image tag to promote (leave empty to promote currently verified dev image)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: promote-prod
  cancel-in-progress: false

env:
  PROJECT_ID: boxwood-scope-292916
  REGION: europe-west2
  ARTIFACT_REPO: handover
  DEV_SERVICE: handover-dev
  PROD_SERVICE: handover-prod
  WIF_PROVIDER: projects/532827973195/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: handover-deployer@boxwood-scope-292916.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: handover-runtime@boxwood-scope-292916.iam.gserviceaccount.com

jobs:
  promote-prod:
    name: Promote Verified Image to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke-check.outputs.service_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Pre-flight verify Dev service health
        id: preflight-dev
        run: |
          DEV_URL="$(gcloud run services describe "${{ env.DEV_SERVICE }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(status.url)")"
          echo "dev_url=${DEV_URL}" >> "$GITHUB_OUTPUT"
          echo "Checking dev service pre-flight health at ${DEV_URL}/api/healthz..."

          HEALTHY=false
          for i in {1..12}; do
            HTTP_CODE="$(curl -s -o /tmp/dev_health.json -w "%{http_code}" "${DEV_URL}/api/healthz" || echo "000")"
            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS="$(python3 -c "import json; data=json.load(open('/tmp/dev_health.json')); print(data.get('status', ''))" 2>/dev/null || echo "")"
              if [ "${STATUS}" = "ok" ]; then
                HEALTHY=true
                echo "Dev pre-flight health verified successfully:"
                cat /tmp/dev_health.json
                echo ""
                break
              fi
            fi
            echo "Waiting for dev healthz pre-flight (attempt $i, status: ${HTTP_CODE})..."
            sleep 5
          done

          if [ "${HEALTHY}" != "true" ]; then
            echo "Dev pre-flight health verification failed with status: ${HTTP_CODE}"
            cat /tmp/dev_health.json 2>/dev/null || true
            exit 1
          fi

      - name: Resolve verified image from Dev
        id: resolve-image
        run: |
          OVERRIDE_TAG="${{ github.event.inputs.override_image_tag }}"
          if [ -n "${OVERRIDE_TAG}" ]; then
            IMAGE_TAG="${OVERRIDE_TAG}"
            IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/app:${IMAGE_TAG}"
            echo "Using manual override image tag: ${IMAGE_TAG}"
          else
            IMAGE_URI="$(gcloud run services describe "${{ env.DEV_SERVICE }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(spec.template.spec.containers[0].image)")"
            IMAGE_TAG="${IMAGE_URI##*:}"
            echo "Resolved verified dev image: ${IMAGE_URI} (tag: ${IMAGE_TAG})"
          fi
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run database migration job for Production
        env:
          IMAGE_URI: ${{ steps.resolve-image.outputs.image_uri }}
          IMAGE_TAG: ${{ steps.resolve-image.outputs.image_tag }}
          GCP_PROJECT: ${{ env.PROJECT_ID }}
          GCP_REGION: ${{ env.REGION }}
          RUNTIME_EMAIL: ${{ env.RUNTIME_SERVICE_ACCOUNT }}
        run: |
          chmod +x ./infra/06-cloud-run-migrate-job.sh
          ./infra/06-cloud-run-migrate-job.sh prod
          gcloud run jobs execute handover-migrate-prod \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --wait

      - name: Deploy identical artifact to Production
        env:
          IMAGE_URI: ${{ steps.resolve-image.outputs.image_uri }}
          IMAGE_TAG: ${{ steps.resolve-image.outputs.image_tag }}
        run: |
          gcloud run deploy "${{ env.PROD_SERVICE }}" \
            --image="${IMAGE_URI}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --service-account="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --network="default" \
            --subnet="default" \
            --vpc-egress="private-ranges-only" \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=120 \
            --port=8000 \
            --allow-unauthenticated \
            --clear-cloudsql-instances \
            --set-secrets=DATABASE_URL=DATABASE_URL_PROD:latest,ADMIN_TOKEN=ADMIN_TOKEN_PROD:latest,RELAY_WEBHOOK_TOKEN=RELAY_WEBHOOK_TOKEN_PROD:latest \
            --set-env-vars="APP_ENV=prod,APP_VERSION=${IMAGE_TAG},GCP_PROJECT=${{ env.PROJECT_ID }},GCP_LOCATION=global,LLM_BACKEND=vertex,ACTIVE_MODEL=google/gemini-3.5-flash-lite,FALLBACK_MODEL=google/gemini-3.1-flash-lite,LLM_TIMEOUT_S=20,OTEL_EXPORTER_OTLP_ENDPOINT=http://10.154.0.3:4318"

      - name: Perform production smoke check
        id: smoke-check
        run: |
          PROD_URL="$(gcloud run services describe "${{ env.PROD_SERVICE }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(status.url)")"
          echo "service_url=${PROD_URL}" >> "$GITHUB_OUTPUT"
          echo "Verifying production health check at ${PROD_URL}/api/healthz..."

          HEALTHY=false
          for i in {1..12}; do
            HTTP_CODE="$(curl -s -o /tmp/health.json -w "%{http_code}" "${PROD_URL}/api/healthz" || echo "000")"
            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS="$(python3 -c "import json; data=json.load(open('/tmp/health.json')); print(data.get('status', ''))" 2>/dev/null || echo "")"
              ENV_NAME="$(python3 -c "import json; data=json.load(open('/tmp/health.json')); print(data.get('environment', ''))" 2>/dev/null || echo "")"
              if [ "${STATUS}" = "ok" ] && [ "${ENV_NAME}" = "prod" ]; then
                HEALTHY=true
                echo "Production health check succeeded:"
                cat /tmp/health.json
                echo ""
                break
              else
                echo "Response received (HTTP 200) but payload unexpected: status='${STATUS}', environment='${ENV_NAME}'"
              fi
            fi
            echo "Waiting for production healthz (attempt $i, status: ${HTTP_CODE})..."
            sleep 5
          done

          if [ "${HEALTHY}" != "true" ]; then
            echo "Production health verification failed with status: ${HTTP_CODE}"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

      - name: Generate promotion step summary
        run: |
          PROD_URL="$(gcloud run services describe "${{ env.PROD_SERVICE }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(status.url)")"
          REVISION="$(gcloud run services describe "${{ env.PROD_SERVICE }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(status.latestReadyRevisionName)")"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🌟 Promotion to Production Successful

          - **Service:** \`${{ env.PROD_SERVICE }}\`
          - **Environment:** \`prod\`
          - **Region:** \`${{ env.REGION }}\`
          - **Promoted Image Tag:** \`${{ steps.resolve-image.outputs.image_tag }}\`
          - **Production Revision:** \`${REVISION}\`
          - **Production URL:** [${PROD_URL}](${PROD_URL})
          - **Health Endpoint:** [${PROD_URL}/api/healthz](${PROD_URL}/api/healthz)
          EOF
