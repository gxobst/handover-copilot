name: GCP CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: gcp-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Run backend unit tests
        working-directory: backend
        env:
          LLM_BACKEND: fake
          APP_ENV: test
        run: uv run pytest tests

  frontend-test:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  integration-and-e2e:
    name: Compose Integration and Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies and Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and boot Docker Compose stack
        run: |
          docker compose up -d --build --wait

      - name: Health check loop
        run: |
          HEALTHY=false
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/api/healthz; then
              echo "Compose service is healthy!"
              HEALTHY=true
              break
            fi
            echo "Waiting for service to be healthy (attempt $i)..."
            sleep 2
          done
          if [ "${HEALTHY}" != "true" ]; then
            echo "Compose service failed to become healthy within 60s"
            exit 1
          fi

      - name: Run Docker Compose integration scenarios
        run: |
          python scripts/test_compose_integration.py --base-url http://127.0.0.1:8000

      - name: Run Playwright E2E tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          npm run test:e2e

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose down -v

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
            scripts/screenshots/
          if-no-files-found: ignore

  build-image:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: [integration-and-e2e]
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_ID: boxwood-scope-292916
      REGION: europe-west2
      ARTIFACT_REPO: handover
      WIF_PROVIDER: projects/532827973195/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      WIF_SERVICE_ACCOUNT: handover-deployer@boxwood-scope-292916.iam.gserviceaccount.com
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
      image_uri: ${{ steps.image-tag.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Compute image tag
        id: image-tag
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          TAG="${TIMESTAMP}-${SHORT_SHA}"
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/app:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Build and push container image
        env:
          TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/app"
          docker build \
            -t "${IMAGE_BASE}:${TAG}" \
            -t "${IMAGE_BASE}:latest" \
            .
          docker push "${IMAGE_BASE}:${TAG}"
          docker push "${IMAGE_BASE}:latest"

  deploy-gcp:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: [build-image]
    permissions:
      id-token: write
      contents: read
    env:
      PROJECT_ID: boxwood-scope-292916
      REGION: europe-west2
      ARTIFACT_REPO: handover
      SERVICE_NAME: handover-dev
      WIF_PROVIDER: projects/532827973195/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      WIF_SERVICE_ACCOUNT: handover-deployer@boxwood-scope-292916.iam.gserviceaccount.com
      RUNTIME_SERVICE_ACCOUNT: handover-runtime@boxwood-scope-292916.iam.gserviceaccount.com
      CLOUDSQL_INSTANCE: boxwood-scope-292916:europe-west2:handover-db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Cloud Run migration job
        run: |
          gcloud run jobs execute handover-migrate-dev --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="${{ needs.build-image.outputs.image_uri }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --network="default" \
            --subnet="default" \
            --vpc-egress="private-ranges-only" \
            --port=8000 \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=120 \
            --clear-cloudsql-instances \
            --set-secrets="ADMIN_TOKEN=ADMIN_TOKEN_DEV:latest,RELAY_WEBHOOK_TOKEN=RELAY_WEBHOOK_TOKEN_DEV:latest,DATABASE_URL=DATABASE_URL_DEV:latest" \
            --set-env-vars="APP_ENV=dev,CORS_ORIGINS=*,LLM_BACKEND=vertex,GCP_PROJECT=${{ env.PROJECT_ID }},GCP_LOCATION=global,ACTIVE_MODEL=google/gemini-3.5-flash-lite,FALLBACK_MODEL=google/gemini-3.1-flash-lite,LLM_TIMEOUT_S=20"

      - name: Post-Deployment Health Validation
        id: validate-deploy
        run: |
          SERVICE_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(status.url)")"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "Validating health at ${SERVICE_URL}/api/healthz..."

          HEALTHY=false
          for i in {1..12}; do
            HTTP_CODE="$(curl -s -o /tmp/health.json -w "%{http_code}" "${SERVICE_URL}/api/healthz" || echo "000")"
            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS_VAL="$(python3 -c "import json; print(json.load(open('/tmp/health.json')).get('status', ''))" 2>/dev/null || true)"
              if [ "${STATUS_VAL}" = "ok" ]; then
                HEALTHY=true
                echo "Health check passed with status: ok"
                cat /tmp/health.json
                echo ""
                break
              else
                echo "HTTP 200 returned but status is '${STATUS_VAL}' (attempt $i)..."
              fi
            else
              echo "Waiting for healthz (attempt $i, status: ${HTTP_CODE})..."
            fi
            sleep 5
          done

          if [ "${HEALTHY}" != "true" ]; then
            echo "Health verification failed!"
            exit 1
          fi

          REVISION="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format="value(status.latestReadyRevisionName)" || echo "unknown")"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 GCP CI/CD Pipeline Deployment Successful

          - **Service:** \`${{ env.SERVICE_NAME }}\`
          - **Environment:** \`${{ github.event.inputs.target_env || 'dev' }}\`
          - **Region:** \`${{ env.REGION }}\`
          - **Project:** \`${{ env.PROJECT_ID }}\`
          - **Image:** \`${{ needs.build-image.outputs.image_uri }}\`
          - **Image Tag:** \`${{ needs.build-image.outputs.image_tag }}\`
          - **Revision:** \`${REVISION}\`
          - **Service URL:** [${SERVICE_URL}](${SERVICE_URL})
          - **Health Endpoint:** [${SERVICE_URL}/api/healthz](${SERVICE_URL}/api/healthz)
          - **Status:** Healthy (\`status == "ok"\`)
          EOF
