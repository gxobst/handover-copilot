[project]
name = "backend"
version = "0.1.0"
description = "Shift Handover Copilot Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.162.7",
    "google-genai>=1.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
